## Arquivo de configuração de exemplo do BepInEx (gerado automaticamente na 1a execução).
## Só o ANFITRIÃO precisa ajustar estas opções.

[Geral]
## Liga/desliga o modo NO VOTE = DEATH.
Ativado = true
## Segundos de votação (0 = usar o padrão da sala; com 0 não existe tempo limite e ninguém é eliminado por tempo).
TempoDeVotacao = 0
## Se desligado, ninguém morre.
EliminarQuemNaoVotou = true

[Interface]
## Avisa quando restam 10s ou menos (só para quem ainda não votou).
AvisoAntesDoFim = true
## Mostra a mensagem de eliminação (no host).
EfeitoVisualDaEliminacao = true
